el":"Angel","categoria":"estrategico"},{"label":"VC","categoria":"estrategico"},{"label":"Venture Capital","categoria":"estrategico"},{"label":"Unicórnio","categoria":"estrategico"},{"label":"Decacórnio","categoria":"estrategico"},{"label":"Scale-up","categoria":"estrategico"},{"label":"Bootstrapped","categoria":"estrategico"},{"label":"Lean Startup","categoria":"estrategico"},{"label":"Design Sprint","categoria":"estrategico"},{"label":"Jobs to be Done","categoria":"estrategico"},{"label":"Blue Ocean","categoria":"estrategico"},{"label":"Disruption","categoria":"estrategico"},{"label":"Freemium","categoria":"estrategico"},{"label":"SaaS","categoria":"estrategico"},{"label":"PLG","categoria":"estrategico"},{"label":"Growth Hacking","categoria":"marketing"},{"label":"SEO","categoria":"marketing"},{"label":"SEM","categoria":"marketing"},{"label":"Inbound","categoria":"marketing"},{"label":"Outbound","categoria":"marketing"},{"label":"Funil AIDA","categoria":"marketing"},{"label":"Brand Awareness","categoria":"marketing"},{"label":"CTR","categoria":"marketing"},{"label":"CPC","categoria":"marketing"},{"label":"CPM","categoria":"marketing"},{"label":"Engajamento","categoria":"marketing"},{"label":"Persona","categoria":"marketing"},{"label":"Jornada do Cliente","categoria":"marketing"},{"label":"CRO","categoria":"marketing"},{"label":"A/B Test","categoria":"marketing"},{"label":"Copywriting","categoria":"marketing"},{"label":"Landing Page","categoria":"marketing"},{"label":"People Analytics","categoria":"rh"},{"label":"Employer Brand","categoria":"rh"},{"label":"Cultura Organizacional","categoria":"rh"},{"label":"OKR Review","categoria":"rh"},{"label":"Feedback 360","categoria":"rh"},{"label":"One-on-One","categoria":"rh"},{"label":"Squad","categoria":"rh"},{"label":"Chapter","categoria":"rh"},{"label":"Tribe","categoria":"rh"},{"label":"C-Level","categoria":"rh"},{"label":"Head","categoria":"rh"},{"label":"CLT","categoria":"juridico"},{"label":"API","categoria":"tecnologia"},{"label":"DevOps","categoria":"tecnologia"},{"label":"Agile","categoria":"gestao"},{"label":"Scrum","categoria":"gestao"},{"label":"Kanban","categoria":"gestao"},{"label":"Lean","categoria":"gestao"},{"label":"Six Sigma","categoria":"operacional"},{"label":"ERP","categoria":"tecnologia"},{"label":"CRM","categoria":"tecnologia"},{"label":"BI","categoria":"tecnologia"},{"label":"Data Lake","categoria":"tecnologia"},{"label":"Machine Learning","categoria":"tecnologia"},{"label":"Automação","categoria":"tecnologia"},{"label":"Cloud","categoria":"tecnologia"},{"label":"Microservices","categoria":"tecnologia"},{"label":"Deploy","categoria":"tecnologia"},{"label":"Sprint Review","categoria":"gestao"}];

const CORES = {
  financeiro:  [255,160,0],
  comercial:   [255,50,70],
  operacional: [200,80,255],
  gestao:      [30,140,255],
  rh:          [0,220,200],
  juridico:    [40,230,80],
  tecnologia:  [255,230,0],
  marketing:   [255,80,180],
  estrategico: [230,60,255],
  geral:       [130,130,155],
};

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resize();
window.addEventListener('resize', resize);

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const SHUFFLED = shuffle(RAW);

// 350 posições visíveis, cada uma com ~3 termos rodando
const SLOT_COUNT = 462;
const TERMS_PER_SLOT = Math.max(3, Math.floor(SHUFFLED.length / SLOT_COUNT));

// Montar slots
const slots = [];
for(let i=0;i<SLOT_COUNT;i++){
  const start = (i * TERMS_PER_SLOT) % SHUFFLED.length;
  const chunk = [];
  for(let j=0;j<TERMS_PER_SLOT;j++){
    chunk.push(SHUFFLED[(start+j) % SHUFFLED.length]);
  }
  slots.push(chunk);
}

// Fibonacci sphere
const PHI = Math.PI*(3-Math.sqrt(5));
const particles = [];
for(let i=0;i<SLOT_COUNT;i++){
  const y0=1-(i/(SLOT_COUNT-1))*2;
  const r=Math.sqrt(Math.max(0,1-y0*y0));
  const th=PHI*i;
  const terms=slots[i];
  const c0=CORES[terms[0].categoria]||CORES.geral;
  const c1=CORES[terms[1%terms.length].categoria]||CORES.geral;
  particles.push({
    ox:Math.cos(th)*r, oy:y0, oz:Math.sin(th)*r,
    terms,
    idx:0,
    r:c0[0], g:c0[1], b:c0[2],
    tr:c1[0], tg:c1[1], tb:c1[2],
    timer:(i/SLOT_COUNT)*3.0,
    switchEvery: 2.5+Math.random()*2.0,
  });
}

// câmera
let rotY=0, rotX=0.25, camZ=2.8;
let drag=false, lx=0, ly=0, vx=0;
let fontOk=false;
document.fonts.ready.then(()=>{ fontOk=true; });

function ry3(x,y,z,a){ const c=Math.cos(a),s=Math.sin(a); return [x*c-z*s,y,x*s+z*c]; }
function rx3(x,y,z,a){ const c=Math.cos(a),s=Math.sin(a); return [x,y*c-z*s,y*s+z*c]; }
function lerp(a,b,t){ return a+(b-a)*t; }

canvas.addEventListener('mousedown',e=>{ drag=true;lx=e.clientX;ly=e.clientY;vx=0; });
canvas.addEventListener('mouseup',  ()=>{ drag=false; });
canvas.addEventListener('mouseleave',()=>{ drag=false; });
canvas.addEventListener('mousemove', e=>{
  if(!drag) return;
  vx=(e.clientX-lx)*0.009; rotY+=vx; rotX+=(e.clientY-ly)*0.009;
  lx=e.clientX; ly=e.clientY; tip.style.display='none';
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  camZ-=e.deltaY*0.003;
  camZ=Math.max(-1.8,Math.min(5.0,camZ));
},{passive:false});

let tlx=0,tly=0,lastDist=0;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault(); drag=true; vx=0;
  tlx=e.touches[0].clientX; tly=e.touches[0].clientY;
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    lastDist=Math.sqrt(dx*dx+dy*dy);
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{ e.preventDefault(); drag=false; },{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.sqrt(dx*dx+dy*dy);
    camZ-=(d-lastDist)*0.015; camZ=Math.max(-1.8,Math.min(5.0,camZ)); lastDist=d; return;
  }
  vx=(e.touches[0].clientX-tlx)*0.009; rotY+=vx; rotX+=(e.touches[0].clientY-tly)*0.009;
  tlx=e.touches[0].clientX; tly=e.touches[0].clientY;
},{passive:false});

const tip=document.getElementById('tip');
canvas.addEventListener('mousemove',e=>{
  if(drag) return;
  const CX=canvas.width/2, CY=canvas.height/2;
  const SS=Math.min(canvas.width,canvas.height)*0.42;
  const F=1.5;
  const proj=particles.map(p=>{
    let [x,y,z]=ry3(p.ox,p.oy,p.oz,rotY); [x,y,z]=rx3(x,y,z,rotX);
    const dz=camZ-z; if(dz<=0.05) return null;
    const s=F/dz;
    const t=p.terms[p.idx];
    const len=t.label.length;
    const fs=(len<=4?14:len<=8?12:len<=14?10:8)*s;
    return {p,sx:CX+x*s*SS,sy:CY+y*s*SS,fs,dz};
  }).filter(Boolean).sort((a,b)=>a.dz-b.dz);
  for(const pp of proj){
    const hr=Math.max(pp.fs*0.5,6);
    if((e.clientX-pp.sx)**2+(e.clientY-pp.sy)**2<hr*hr){
      tip.style.display='block';
      tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px';
      const r=Math.round(pp.p.r),g=Math.round(pp.p.g),b=Math.round(pp.p.b);
      tip.style.borderColor='rgb('+r+','+g+','+b+')';
      tip.style.color='rgb('+r+','+g+','+b+')';
      tip.textContent=pp.p.terms[pp.p.idx].label;
      return;
    }
  }
  tip.style.display='none';
});

const COLOR_LERP = 0.03;
let lastTs=null;

function draw(ts){
  if(!lastTs) lastTs=ts;
  const dt=(ts-lastTs)/1000;
  lastTs=ts;

  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!drag){ vx=lerp(vx,0,0.06); rotY+=vx+0.0025; }

  const CX=canvas.width/2, CY=canvas.height/2;
  const SS=Math.min(canvas.width,canvas.height)*0.42;
  const F=1.5;
  const inside=camZ<1.05;
  const font=fontOk?'Orbitron':'monospace';

  for(const p of particles){
    p.timer+=dt;
    if(p.timer>=p.switchEvery){
      p.timer=0;
      p.idx=(p.idx+1)%p.terms.length;
      const nc=CORES[p.terms[(p.idx+1)%p.terms.length].categoria]||CORES.geral;
      p.tr=nc[0]; p.tg=nc[1]; p.tb=nc[2];
    }
    p.r=lerp(p.r,p.tr,COLOR_LERP);
    p.g=lerp(p.g,p.tg,COLOR_LERP);
    p.b=lerp(p.b,p.tb,COLOR_LERP);
  }

  const proj=[];
  for(const p of particles){
    let [x,y,z]=ry3(p.ox,p.oy,p.oz,rotY); [x,y,z]=rx3(x,y,z,rotX);
    const dz=camZ-z; if(dz<=0.01) continue;
    const s=F/dz;
    proj.push({p,sx:CX+x*s*SS,sy:CY+y*s*SS,z,dz,s});
  }
  // --- PALAVRA CENTRAL (perspectiva real — cresce ao se aproximar) ---
  const elapsed = ts / 1000;
  const centerIdx = Math.floor(elapsed / 0.055) % RAW.length;
  const centerTerm = RAW[centerIdx];
  const centerRgb = CORES[centerTerm.categoria] || CORES.geral;
  const pulse = 0.5 + 0.25 * Math.sin(elapsed * 5.0);
  const cr = centerRgb[0], cg = centerRgb[1], cb = centerRgb[2];
  // só desenha se câmera não passou pelo centro (camZ > 0.04)
  if(camZ > 0.04) {
    const dz = camZ; // centro do globo em z=0
    const perspScale = F / dz; // quanto maior a aproximação, maior a escala
    const clen = centerTerm.label.length;
    const cBase = clen <= 4 ? 46 : clen <= 8 ? 37 : clen <= 14 ? 30 : clen <= 20 ? 22 : 16;
    const globeRadius = SS * perspScale;
    const maxW = (globeRadius * 1.6) / Math.max(1, clen * 0.52);
    const maxH = globeRadius * 0.72;
    const cfs = Math.min(cBase * perspScale * (SS / 160), maxW, maxH);
    if(cfs >= 3) {
      const glowStr = Math.min(0.6, 0.3 * perspScale);
      ctx.shadowColor = 'rgba(255,255,255,'+glowStr.toFixed(2)+')';
      ctx.shadowBlur = Math.min(30, 12 * perspScale);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const cfont = fontOk ? 'Orbitron' : 'monospace';
      ctx.font = '700 ' + Math.round(cfs) + 'px \'' + cfont + '\', monospace';
      ctx.fillStyle = 'rgba(255,255,255,'+pulse.toFixed(3)+')';
      // no centro, girando em torno do proprio eixo
    // palavra no centro
    ctx.shadowColor = 'rgba(255,255,255,0.25)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(255,255,255,'+pulse.toFixed(3)+')';
    ctx.fillText(centerTerm.label, CX, CY);
    ctx.shadowBlur = 0;
      ctx.shadowBlur = 0;
    }
  }

  proj.sort((a,b)=>b.dz-a.dz);

  ctx.textAlign='center'; ctx.textBaseline='middle';

  for(const pp of proj){
    const p=pp.p;
    const t=p.terms[p.idx];
    const len=t.label.length;
    const base=len<=4?14:len<=8?12:len<=14?10:8;
    const fs=Math.min(base*pp.s, inside?80:38);
    if(fs<2) continue;

    const normZ=(pp.z+1)/2;
    let alpha=inside?Math.max(0.3,1-pp.dz*0.6):(0.06+normZ*0.94);
    if(alpha<0.01) continue;

    const r=Math.round(p.r),g=Math.round(p.g),b=Math.round(p.b);

    if(pp.dz<1.2 && alpha>0.4){
      ctx.shadowColor='rgba('+r+','+g+','+b+',0.4)';
      ctx.shadowBlur=4;
    } else { ctx.shadowBlur=0; }

    ctx.font=Math.round(fs)+'px \''+font+'\', monospace';
    ctx.fillStyle='rgba('+r+','+g+','+b+','+Math.min(alpha,1).toFixed(3)+')';
    ctx.fillText(t.label, pp.sx, pp.sy);
  }

  ctx.shadowBlur=0;

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

</script>
