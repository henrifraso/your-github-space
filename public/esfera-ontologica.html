<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ontologia Empresarial OS¹ v1</title>
<!--
  Ontologia Empresarial OS¹ v1 — Brasil-first, universal-ready.
  Esta base é usada como vocabulário estrutural para diagnóstico futuro
  de empresas por domínio, risco, lacuna, oportunidade e ação.

  Dados carregados de: /ontology-data.json (~1.8 MB)
  Exposição global: window.OS1_ONTOLOGY_TERMS (após boot)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; color:#fff; font-family:'Inter',sans-serif; }
  canvas { display:block; }

  /* Tooltip enriquecido */
  #tip {
    position:fixed; pointer-events:none;
    background:rgba(0,0,0,0.92); border:1px solid #333;
    padding:6px 10px; font-size:10.5px; letter-spacing:0.06em;
    font-family:'Orbitron',monospace;
    border-radius:3px; display:none; z-index:25; white-space:nowrap;
    box-shadow:0 4px 18px rgba(0,0,0,0.7);
  }
  #tip .meta { display:block; font-size:9px; opacity:0.7; margin-top:2px; letter-spacing:0.04em; }

  /* Barra superior — busca + filtros */
  #topbar {
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    z-index:30; display:flex; gap:8px; flex-wrap:wrap;
    max-width:calc(100vw - 28px);
    align-items:center;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px; padding:8px 12px;
  }
  #topbar input, #topbar select {
    background:rgba(255,255,255,0.04); color:#fff;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:8px; padding:7px 10px;
    font-size:12px; font-family:inherit; outline:none;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  #topbar input { width:200px; }
  #topbar input::placeholder { color:rgba(255,255,255,0.4); }
  #topbar input:focus, #topbar select:focus {
    border-color:rgba(184,145,58,0.6);
    background:rgba(184,145,58,0.06);
  }
  #topbar select { cursor:pointer; min-width:135px; }
  #topbar option { background:#0d0d0e; color:#fff; }
  #topbar #count {
    font-size:10.5px; color:rgba(255,255,255,0.55);
    letter-spacing:0.06em; padding-left:6px;
    font-family:'Orbitron',monospace;
  }
  #topbar button.reset {
    background:transparent; border:1px solid rgba(255,255,255,0.12);
    color:rgba(255,255,255,0.6); padding:7px 10px;
    border-radius:8px; cursor:pointer; font-size:11px;
    transition:all 0.15s ease;
  }
  #topbar button.reset:hover { background:rgba(255,255,255,0.05); color:#fff; }

  /* Legenda lateral — 15 áreas macro */
  #legend {
    position:fixed; left:14px; top:50%; transform:translateY(-50%);
    z-index:28; display:flex; flex-direction:column; gap:5px;
    background:rgba(0,0,0,0.4); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:12px; padding:10px 12px;
    font-size:10px; max-height:78vh; overflow-y:auto;
  }
  #legend .item { display:flex; align-items:center; gap:7px; cursor:pointer;
    padding:3px 4px; border-radius:5px; transition:background 0.12s; }
  #legend .item:hover { background:rgba(255,255,255,0.05); }
  #legend .item.active { background:rgba(255,255,255,0.08); }
  #legend .item .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  #legend .item .name { color:rgba(255,255,255,0.75); white-space:nowrap; font-size:10px; }
  #legend .item.muted .name { opacity:0.4; }
  #legend h4 { font-size:9px; letter-spacing:0.12em; opacity:0.5;
    text-transform:uppercase; margin-bottom:6px; font-weight:600; }

  /* Painel de detalhes do termo */
  #panel {
    position:fixed; right:14px; top:50%; transform:translateY(-50%);
    width:340px; max-height:80vh; overflow-y:auto;
    background:rgba(15,15,16,0.96); backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px; padding:18px 20px;
    z-index:32; display:none;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  #panel.open { display:block; }
  #panel .close {
    position:absolute; top:12px; right:14px;
    background:transparent; border:none; color:rgba(255,255,255,0.5);
    cursor:pointer; font-size:20px; line-height:1; padding:2px 6px;
  }
  #panel .close:hover { color:#fff; }
  #panel h2 {
    font-family:'Orbitron',monospace; font-size:14px;
    font-weight:700; line-height:1.35; margin-bottom:8px;
    color:#fff; padding-right:24px;
  }
  #panel .domain-row {
    font-size:10.5px; letter-spacing:0.04em;
    color:rgba(255,255,255,0.55); margin-bottom:14px;
    display:flex; gap:6px; align-items:center; flex-wrap:wrap;
  }
  #panel .area-badge {
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 8px; border-radius:6px;
    font-size:10px; font-weight:600;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
  }
  #panel .area-badge .swatch { width:7px; height:7px; border-radius:50%; }
  #panel .row {
    display:flex; justify-content:space-between; padding:7px 0;
    font-size:11.5px; border-bottom:1px solid rgba(255,255,255,0.04);
    gap:12px;
  }
  #panel .row:last-child { border-bottom:none; }
  #panel .row .k { color:rgba(255,255,255,0.45); white-space:nowrap; }
  #panel .row .v { color:#fff; text-align:right; font-weight:500; }
  #panel .row .v.list { text-align:right; line-height:1.5; max-width:200px; }
  #panel .row .v .chip {
    display:inline-block; padding:2px 7px;
    background:rgba(255,255,255,0.06); border-radius:4px;
    font-size:10px; margin:1px;
  }
  #panel .row .v .chip.alta { background:rgba(255,160,80,0.18); color:#ffae55; }
  #panel .row .v .chip.critica { background:rgba(255,80,80,0.22); color:#ff6868; }
  #panel .section-title {
    font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:rgba(255,255,255,0.45); margin:14px 0 6px;
    font-weight:600;
  }
  #panel .acoes {
    display:flex; flex-direction:column; gap:6px; margin-top:2px;
  }
  #panel .acoes .acao {
    background:rgba(184,145,58,0.08); border:1px solid rgba(184,145,58,0.25);
    color:#fff; padding:7px 10px; border-radius:8px;
    font-size:11px; text-align:left;
  }

  /* Loading inicial */
  #loading {
    position:fixed; inset:0; background:#000; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; color:rgba(255,255,255,0.5);
    font-family:'Orbitron',monospace; font-size:11px; letter-spacing:0.18em;
    text-transform:uppercase;
  }
  #loading .spinner {
    width:22px; height:22px;
    border:2px solid rgba(255,255,255,0.1);
    border-top-color:rgba(184,145,58,0.85);
    border-radius:50%; animation:spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Mobile */
  @media (max-width: 768px) {
    #topbar input { width:130px; }
    #topbar select { min-width:100px; font-size:11px; }
    #legend { font-size:9px; left:8px; padding:6px 8px; }
    #legend .item .name { font-size:9px; max-width:90px; overflow:hidden; text-overflow:ellipsis; }
    #panel { right:8px; left:8px; width:auto; max-width:none; transform:none; top:auto; bottom:14px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>carregando ontologia OS¹</span>
</div>

<canvas id="c"></canvas>
<div id="tip"></div>

<div id="emptyMsg" style="
  display:none; position:fixed; inset:0; z-index:15;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  pointer-events:none; color:rgba(255,255,255,0.55); text-align:center;
">
  <div style="font-family:'Orbitron',monospace; font-size:14px; letter-spacing:0.14em; color:rgba(255,255,255,0.45);">
    NENHUM TERMO COMBINA COM OS FILTROS
  </div>
  <div style="font-size:11px; max-width:340px; opacity:0.6; font-family:'Inter',sans-serif;">
    Tente afrouxar a busca ou trocar a sensibilidade.
    Domínios pequenos podem não ter termos de todos os níveis.
  </div>
</div>

<div id="topbar" style="display:none;">
  <input id="searchInput" type="text" placeholder="Buscar termo…" autocomplete="off" />
  <select id="areaFilter"><option value="">Todas as áreas</option></select>
  <select id="dominioFilter"><option value="">Todos os domínios</option></select>
  <select id="sensFilter">
    <option value="">Toda sensibilidade</option>
    <option value="critica">Crítica</option>
    <option value="alta">Alta</option>
    <option value="media">Média</option>
    <option value="baixa">Baixa</option>
  </select>
  <button class="reset" id="resetBtn">Limpar</button>
  <span id="count"></span>
</div>

<div id="legend" style="display:none;">
  <h4>Áreas macro</h4>
</div>

<div id="panel">
  <button class="close" onclick="closePanel()">×</button>
  <h2 id="panelTitle">—</h2>
  <div class="domain-row">
    <span class="area-badge"><span class="swatch" id="panelSwatch"></span><span id="panelArea">—</span></span>
    <span id="panelDominio">—</span>
  </div>
  <div id="panelBody"></div>
</div>

<script>
/* ────────────────────────────────────────────────────────────────────
   Ontologia Empresarial OS¹ v1 — motor da esfera
   Mantém canvas/animação/pan/zoom; adiciona busca + filtros + painel
─────────────────────────────────────────────────────────────────── */

// ── Cores por ÁREA MACRO (15 áreas) ────────────────────────────────
// Cores originais por área — preservadas pra uso no termo central
// (que agora alterna na cor variável que antes pintava as palavras de fora).
const AREAS_ORIGINAL = {
  'Administrativo':            [70, 130, 255],   // azul
  'Comercial':                 [50, 205, 130],   // verde
  'Operacional':               [255, 140, 50],   // laranja
  'Financeiro':                [255, 200, 60],   // dourado
  'Pessoas':                   [255, 130, 200],  // rosa
  'Tecnologia':                [60, 210, 230],   // ciano
  'Mercado':                   [180, 100, 255],  // roxo
  'Estratégia':                [220, 220, 230],  // prata
  'Risco':                     [255, 80, 80],    // vermelho
  'Crescimento':               [255, 235, 80],   // amarelo
  'Governança':                [150, 150, 170],  // cinza
  'Dados':                     [80, 230, 160],   // verde-água
  'Jurídico-Regulatório':      [180, 50, 90],    // vinho
  'Experiência do Cliente':    [255, 170, 110],  // laranja-rosa
  'Cadeia de Valor':           [180, 140, 90],   // marrom
  '_fallback':                 [130, 130, 155],
};

// AREAS atual — todas as áreas usam a cor da Governança (cinza).
// É o que pinta os termos espalhados na esfera (palavras "de fora").
const GOV_GRAY = [150, 150, 170];
const AREAS = {
  'Administrativo':            GOV_GRAY,
  'Comercial':                 GOV_GRAY,
  'Operacional':               GOV_GRAY,
  'Financeiro':                GOV_GRAY,
  'Pessoas':                   GOV_GRAY,
  'Tecnologia':                GOV_GRAY,
  'Mercado':                   GOV_GRAY,
  'Estratégia':                GOV_GRAY,
  'Risco':                     GOV_GRAY,
  'Crescimento':               GOV_GRAY,
  'Governança':                GOV_GRAY,
  'Dados':                     GOV_GRAY,
  'Jurídico-Regulatório':      GOV_GRAY,
  'Experiência do Cliente':    GOV_GRAY,
  'Cadeia de Valor':           GOV_GRAY,
  '_fallback':                 GOV_GRAY,
};

// Adapter: mapeia areaMacro → chave de cor
function colorOf(areaMacro){ return AREAS[areaMacro] || AREAS._fallback; }

// Cor variável original (por área) — usada apenas no termo central animado.
function colorOfOriginal(areaMacro){ return AREAS_ORIGINAL[areaMacro] || AREAS_ORIGINAL._fallback; }

// Estado global
let ONTOLOGY_TERMS = []; // toda a base estruturada
let RAW = [];            // visualizado pelo canvas (compatibilidade)
let visibleSet = null;   // IDs dos termos visíveis (filtros aplicados); null = todos

// ── Boot: carrega JSON externo, popula UI, dispara canvas ──────────
fetch('/ontology-data.json')
  .then(r => r.json())
  .then(data => {
    ONTOLOGY_TERMS = data;
    window.OS1_ONTOLOGY_TERMS = ONTOLOGY_TERMS;
    rebuildVisualArray();
    populateFilters();
    populateLegend();
    document.getElementById('loading').style.display = 'none';
    // Topbar (busca/filtros) e legenda lateral (áreas macro) ocultados —
    // a tela mostra apenas o canvas da esfera. O caller sobrepõe seus
    // próprios botões (Analisar / Fechar) por cima do iframe.
    document.getElementById('topbar').style.display = 'none';
    document.getElementById('legend').style.display = 'none';
    document.getElementById('count').textContent = ONTOLOGY_TERMS.length + ' termos';
    initCanvas();
    // Filtro por setor via ?dept=<id> (vindo do React caller). Mapeia o id
    // do setor do app pra `areaMacro` desta ontologia e aplica o filtro.
    try {
      const dept = new URLSearchParams(window.location.search).get('dept');
      const DEPT_TO_AREA = {
        marketing:  'Mercado',
        vendas:     'Comercial',
        financeiro: 'Financeiro',
        rh:         'Pessoas',
        operacoes:  'Operacional',
        estoque:    'Cadeia de Valor',
        juridico:   'Jurídico-Regulatório',
      };
      const areaMacro = dept && DEPT_TO_AREA[dept];
      if (areaMacro) {
        const areaSel = document.getElementById('areaFilter');
        if (areaSel) {
          areaSel.value = areaMacro;
          refreshDominiosFilter(areaMacro);
          applyFilters();
        }
      }
    } catch (_) { /* noop — sem filtro se algo falhar */ }
  })
  .catch(err => {
    document.getElementById('loading').innerHTML =
      '<span style="color:#f87171;font-family:Inter;letter-spacing:0;text-transform:none">' +
      'Falha ao carregar ontology-data.json: ' + err.message + '</span>';
  });

// Reconstrói o array RAW visual (label + categoria pra compatibilidade com canvas legado)
function rebuildVisualArray(){
  const filtered = visibleSet
    ? ONTOLOGY_TERMS.filter(t => visibleSet.has(t.id))
    : ONTOLOGY_TERMS;
  RAW = filtered.map(t => ({
    label: t.termo,
    categoria: t.areaMacro,
    _ref: t,
  }));
}

// ── UI: filtros ────────────────────────────────────────────────────
function populateFilters(){
  const areas = [...new Set(ONTOLOGY_TERMS.map(t => t.areaMacro))].sort();
  const areaSel = document.getElementById('areaFilter');
  areas.forEach(a => {
    const o = document.createElement('option'); o.value=a; o.textContent=a;
    areaSel.appendChild(o);
  });
  refreshDominiosFilter('');
}
function refreshDominiosFilter(areaSelected){
  const sel = document.getElementById('dominioFilter');
  sel.innerHTML = '<option value="">Todos os domínios</option>';
  const pool = areaSelected
    ? ONTOLOGY_TERMS.filter(t => t.areaMacro === areaSelected)
    : ONTOLOGY_TERMS;
  const doms = [...new Set(pool.map(t => t.dominio))].sort();
  doms.forEach(d => {
    const o = document.createElement('option'); o.value=d; o.textContent=d;
    sel.appendChild(o);
  });
}
function applyFilters(){
  const q     = document.getElementById('searchInput').value.trim().toLowerCase();
  const area  = document.getElementById('areaFilter').value;
  const dom   = document.getElementById('dominioFilter').value;
  const sens  = document.getElementById('sensFilter').value;
  const qNorm = q.normalize('NFD').replace(/[̀-ͯ]/g,'');
  const ids = new Set();
  for(const t of ONTOLOGY_TERMS){
    if(area && t.areaMacro !== area) continue;
    if(dom && t.dominio !== dom) continue;
    if(sens && t.sensibilidade !== sens) continue;
    if(qNorm){
      // Busca também nos sinônimos (case-insensitive, sem acento)
      const inSyn = (t.sinonimos||[]).some(s =>
        s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(qNorm)
      );
      if(!t.termoNormalizado.includes(qNorm) && !inSyn) continue;
    }
    ids.add(t.id);
  }
  visibleSet = (q||area||dom||sens) ? ids : null;
  const cnt = visibleSet ? ids.size : ONTOLOGY_TERMS.length;
  const countEl = document.getElementById('count');
  countEl.textContent = cnt + ' termos';
  countEl.style.color = cnt === 0 ? '#ef4444' : 'rgba(255,255,255,0.55)';
  // Mensagem visual quando filtro zera resultados
  const empty = document.getElementById('emptyMsg');
  if (empty) empty.style.display = cnt === 0 ? 'flex' : 'none';
  rebuildVisualArray();
  rebuildSlots();
}
document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('areaFilter').addEventListener('change', e => {
  refreshDominiosFilter(e.target.value);
  applyFilters();
});
document.getElementById('dominioFilter').addEventListener('change', applyFilters);
document.getElementById('sensFilter').addEventListener('change', applyFilters);
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('areaFilter').value = '';
  document.getElementById('sensFilter').value = '';
  refreshDominiosFilter('');
  applyFilters();
});

// ── UI: legenda ────────────────────────────────────────────────────
function populateLegend(){
  const el = document.getElementById('legend');
  const counts = {};
  for(const t of ONTOLOGY_TERMS) counts[t.areaMacro] = (counts[t.areaMacro]||0)+1;
  Object.keys(AREAS).filter(k => !k.startsWith('_')).forEach(a => {
    const c = AREAS[a];
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML =
      '<span class="dot" style="background:rgb('+c[0]+','+c[1]+','+c[2]+')"></span>' +
      '<span class="name">'+a+' <span style="opacity:0.5">('+(counts[a]||0)+')</span></span>';
    item.addEventListener('click', () => {
      const areaSel = document.getElementById('areaFilter');
      areaSel.value = areaSel.value === a ? '' : a;
      refreshDominiosFilter(areaSel.value);
      applyFilters();
      document.querySelectorAll('#legend .item').forEach(x => x.classList.remove('active'));
      if(areaSel.value === a) item.classList.add('active');
    });
    el.appendChild(item);
  });
}

// ── Painel de detalhes ─────────────────────────────────────────────
function closePanel(){ document.getElementById('panel').classList.remove('open'); }
function openPanelFor(termo){
  const t = termo;
  document.getElementById('panelTitle').textContent = t.termo;
  document.getElementById('panelArea').textContent = t.areaMacro;
  const c = colorOf(t.areaMacro);
  document.getElementById('panelSwatch').style.background = 'rgb('+c[0]+','+c[1]+','+c[2]+')';
  document.getElementById('panelDominio').textContent = '· ' + t.dominio;

  const body = document.getElementById('panelBody');
  const chip = (txt, cls) => '<span class="chip '+(cls||'')+'">'+txt+'</span>';
  const list = arr => arr.map(x => chip(x)).join(' ');

  body.innerHTML = `
    <div class="row"><span class="k">Subdomínio</span><span class="v">${t.subdominio||'—'}</span></div>
    <div class="row"><span class="k">Sensibilidade</span><span class="v">${chip(t.sensibilidade, t.sensibilidade)}</span></div>
    <div class="row"><span class="k">Tipo</span><span class="v list">${list(t.tipo||[])||'—'}</span></div>
    <div class="row"><span class="k">Camada</span><span class="v">${t.camada} · ${t.escopo}</span></div>
    <div class="row"><span class="k">País base</span><span class="v">${t.paisBase}</span></div>
    <div class="row"><span class="k">Aplicável a</span><span class="v list">${list((t.aplicavelA||[]).slice(0,4))||'—'}</span></div>
    <div class="row"><span class="k">Maturidade esperada</span><span class="v">${t.maturidadeEsperada}</span></div>
    <div class="row"><span class="k">Peso base</span><span class="v">${(t.pesoBase||0).toFixed(2)}</span></div>
    <div class="row"><span class="k">Validação humana</span><span class="v">${t.requerValidacaoHumana?'sim':'não'}</span></div>
    ${t.categoriaOriginal ? `<div class="row"><span class="k">Categoria legada</span><span class="v">${t.categoriaOriginal}</span></div>`:''}

    ${(t.setoresEspecificos && t.setoresEspecificos.length) ? `
    <div class="section-title">Setores específicos</div>
    <div class="v list">${list(t.setoresEspecificos)}</div>` : ''}

    ${(t.sinonimos && t.sinonimos.length) ? `
    <div class="section-title">Sinônimos e equivalentes</div>
    <div class="v list" style="line-height:1.6">${list(t.sinonimos)}</div>` : ''}

    <div class="section-title">Agentes sugeridos</div>
    <div class="v list">${list(t.agentesSugeridos||[])}</div>

    <div class="section-title">Ações possíveis</div>
    <div class="acoes">${(t.acoesPossiveis||[]).map(a => '<div class="acao">'+a+'</div>').join('')}</div>
  `;
  document.getElementById('panel').classList.add('open');
}

/* Canvas e animação — bloco abaixo, dispara via initCanvas() depois do fetch */

// ── Canvas setup ────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resize();
window.addEventListener('resize', resize);

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const SLOT_COUNT = 462;
let particles = [];
let SHUFFLED = [];

function rebuildSlots(){
  if(RAW.length === 0){ particles = []; return; }
  SHUFFLED = shuffle(RAW);
  const TERMS_PER_SLOT = Math.max(3, Math.floor(SHUFFLED.length / SLOT_COUNT));
  const slots = [];
  for(let i=0;i<SLOT_COUNT;i++){
    const start = (i * TERMS_PER_SLOT) % SHUFFLED.length;
    const chunk = [];
    for(let j=0;j<TERMS_PER_SLOT;j++){
      chunk.push(SHUFFLED[(start+j) % SHUFFLED.length]);
    }
    slots.push(chunk);
  }
  const PHI = Math.PI*(3-Math.sqrt(5));
  particles = [];
  for(let i=0;i<SLOT_COUNT;i++){
    const y0=1-(i/(SLOT_COUNT-1))*2;
    const r=Math.sqrt(Math.max(0,1-y0*y0));
    const th=PHI*i;
    const terms=slots[i];
    const c0=colorOf(terms[0].categoria);
    const c1=colorOf(terms[1%terms.length].categoria);
    particles.push({
      ox:Math.cos(th)*r, oy:y0, oz:Math.sin(th)*r,
      terms, idx:0,
      r:c0[0], g:c0[1], b:c0[2],
      tr:c1[0], tg:c1[1], tb:c1[2],
      timer:(i/SLOT_COUNT)*3.0,
      switchEvery: 2.5+Math.random()*2.0,
    });
  }
}

// ── Câmera + interação ────────────────────────────────────────────
let rotY=0, rotX=0.25, camZ=2.8;
let drag=false, lx=0, ly=0, vx=0;
let fontOk=false;
document.fonts.ready.then(()=>{ fontOk=true; });

function ry3(x,y,z,a){ const c=Math.cos(a),s=Math.sin(a); return [x*c-z*s,y,x*s+z*c]; }
function rx3(x,y,z,a){ const c=Math.cos(a),s=Math.sin(a); return [x,y*c-z*s,y*s+z*c]; }
function lerp(a,b,t){ return a+(b-a)*t; }

// Clique (sem drag) → abre painel do termo sob o cursor
let pressStart = 0, pressX = 0, pressY = 0;
canvas.addEventListener('mousedown',e=>{
  drag=true;lx=e.clientX;ly=e.clientY;vx=0;
  pressStart=Date.now(); pressX=e.clientX; pressY=e.clientY;
});
canvas.addEventListener('mouseup', e => {
  drag=false;
  const dt = Date.now() - pressStart;
  const dx = Math.abs(e.clientX - pressX);
  const dy = Math.abs(e.clientY - pressY);
  if(dt < 220 && dx < 6 && dy < 6){
    const hit = pickAt(e.clientX, e.clientY);
    if(hit && hit.p.terms[hit.p.idx]._ref) openPanelFor(hit.p.terms[hit.p.idx]._ref);
  }
});
canvas.addEventListener('mouseleave',()=>{ drag=false; });
canvas.addEventListener('mousemove', e=>{
  if(!drag) return;
  vx=(e.clientX-lx)*0.009; rotY+=vx; rotX+=(e.clientY-ly)*0.009;
  lx=e.clientX; ly=e.clientY; tip.style.display='none';
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  camZ-=e.deltaY*0.003;
  camZ=Math.max(-1.8,Math.min(5.0,camZ));
},{passive:false});

let tlx=0,tly=0,lastDist=0;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault(); drag=true; vx=0;
  tlx=e.touches[0].clientX; tly=e.touches[0].clientY;
  pressStart=Date.now(); pressX=tlx; pressY=tly;
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    lastDist=Math.sqrt(dx*dx+dy*dy);
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault(); drag=false;
  const dt = Date.now() - pressStart;
  if(dt < 220 && e.changedTouches && e.changedTouches[0]){
    const tx = e.changedTouches[0].clientX, ty = e.changedTouches[0].clientY;
    if(Math.abs(tx-pressX) < 6 && Math.abs(ty-pressY) < 6){
      const hit = pickAt(tx, ty);
      if(hit && hit.p.terms[hit.p.idx]._ref) openPanelFor(hit.p.terms[hit.p.idx]._ref);
    }
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.sqrt(dx*dx+dy*dy);
    camZ-=(d-lastDist)*0.015; camZ=Math.max(-1.8,Math.min(5.0,camZ)); lastDist=d; return;
  }
  vx=(e.touches[0].clientX-tlx)*0.009; rotY+=vx; rotX+=(e.touches[0].clientY-tly)*0.009;
  tlx=e.touches[0].clientX; tly=e.touches[0].clientY;
},{passive:false});

// ── Tooltip + picking ─────────────────────────────────────────────
const tip=document.getElementById('tip');

function pickAt(mx, my){
  const CX=canvas.width/2, CY=canvas.height/2;
  const SS=Math.min(canvas.width,canvas.height)*0.42;
  const F=1.5;
  const proj=particles.map(p=>{
    let [x,y,z]=ry3(p.ox,p.oy,p.oz,rotY); [x,y,z]=rx3(x,y,z,rotX);
    const dz=camZ-z; if(dz<=0.05) return null;
    const s=F/dz;
    const t=p.terms[p.idx];
    const len=t.label.length;
    const fs=(len<=4?14:len<=8?12:len<=14?10:8)*s;
    return {p,sx:CX+x*s*SS,sy:CY+y*s*SS,fs,dz};
  }).filter(Boolean).sort((a,b)=>a.dz-b.dz);
  for(const pp of proj){
    const hr=Math.max(pp.fs*0.5,6);
    if((mx-pp.sx)**2+(my-pp.sy)**2<hr*hr) return pp;
  }
  return null;
}

canvas.addEventListener('mousemove',e=>{
  if(drag) return;
  const hit = pickAt(e.clientX, e.clientY);
  if(hit){
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px';
    const r=Math.round(hit.p.r),g=Math.round(hit.p.g),b=Math.round(hit.p.b);
    tip.style.borderColor='rgb('+r+','+g+','+b+')';
    tip.style.color='rgb('+r+','+g+','+b+')';
    const t = hit.p.terms[hit.p.idx];
    const ref = t._ref || {};
    tip.innerHTML = t.label +
      '<span class="meta">' + (ref.dominio||'') +
      (ref.sensibilidade ? ' · ' + ref.sensibilidade : '') + '</span>';
    return;
  }
  tip.style.display='none';
});

// ── Loop de render ────────────────────────────────────────────────
const COLOR_LERP = 0.03;
let lastTs=null;

function draw(ts){
  if(!lastTs) lastTs=ts;
  const dt=(ts-lastTs)/1000;
  lastTs=ts;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!drag){ vx=lerp(vx,0,0.06); rotY+=vx+0.0025; }
  const CX=canvas.width/2, CY=canvas.height/2;
  const SS=Math.min(canvas.width,canvas.height)*0.42;
  const F=1.5;
  const inside=camZ<1.05;
  const font=fontOk?'Orbitron':'monospace';

  for(const p of particles){
    p.timer+=dt;
    if(p.timer>=p.switchEvery){
      p.timer=0;
      p.idx=(p.idx+1)%p.terms.length;
      const nc=colorOf(p.terms[(p.idx+1)%p.terms.length].categoria);
      p.tr=nc[0]; p.tg=nc[1]; p.tb=nc[2];
    }
    p.r=lerp(p.r,p.tr,COLOR_LERP);
    p.g=lerp(p.g,p.tg,COLOR_LERP);
    p.b=lerp(p.b,p.tb,COLOR_LERP);
  }

  const proj=[];
  for(const p of particles){
    let [x,y,z]=ry3(p.ox,p.oy,p.oz,rotY); [x,y,z]=rx3(x,y,z,rotX);
    const dz=camZ-z; if(dz<=0.01) continue;
    const s=F/dz;
    proj.push({p,sx:CX+x*s*SS,sy:CY+y*s*SS,z,dz,s});
  }

  // Termo central animado (mantém efeito original)
  if(RAW.length > 0){
    const elapsed = ts / 1000;
    const centerIdx = Math.floor(elapsed / 0.055) % RAW.length;
    const centerTerm = RAW[centerIdx];
    const pulse = 0.5 + 0.25 * Math.sin(elapsed * 5.0);
    if(camZ > 0.04) {
      const dz = camZ;
      const perspScale = F / dz;
      const clen = centerTerm.label.length;
      const cBase = clen <= 4 ? 46 : clen <= 8 ? 37 : clen <= 14 ? 30 : clen <= 20 ? 22 : 16;
      const globeRadius = SS * perspScale;
      const maxW = (globeRadius * 1.6) / Math.max(1, clen * 0.52);
      const maxH = globeRadius * 0.72;
      const cfs = Math.min(cBase * perspScale * (SS / 160), maxW, maxH);
      if(cfs >= 3) {
        // Cor variável por área (a mesma paleta que antes era usada nas palavras de fora).
        const co = colorOfOriginal(centerTerm.categoria);
        const cr = co[0], cg = co[1], cb = co[2];
        ctx.shadowColor = 'rgba('+cr+','+cg+','+cb+',0.35)';
        ctx.shadowBlur = 10;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const cfont = fontOk ? 'Orbitron' : 'monospace';
        ctx.font = '700 ' + Math.round(cfs) + 'px \'' + cfont + '\', monospace';
        ctx.fillStyle = 'rgba('+cr+','+cg+','+cb+','+pulse.toFixed(3)+')';
        ctx.fillText(centerTerm.label, CX, CY);
        ctx.shadowBlur = 0;
      }
    }
  }

  proj.sort((a,b)=>b.dz-a.dz);
  ctx.textAlign='center'; ctx.textBaseline='middle';

  for(const pp of proj){
    const p=pp.p;
    const t=p.terms[p.idx];
    const len=t.label.length;
    const base=len<=4?14:len<=8?12:len<=14?10:8;
    const fs=Math.min(base*pp.s, inside?80:38);
    if(fs<2) continue;
    const normZ=(pp.z+1)/2;
    let alpha=inside?Math.max(0.3,1-pp.dz*0.6):(0.06+normZ*0.94);
    if(alpha<0.01) continue;
    const r=Math.round(p.r),g=Math.round(p.g),b=Math.round(p.b);
    if(pp.dz<1.2 && alpha>0.4){
      ctx.shadowColor='rgba('+r+','+g+','+b+',0.4)';
      ctx.shadowBlur=4;
    } else { ctx.shadowBlur=0; }
    ctx.font=Math.round(fs)+'px \''+font+'\', monospace';
    ctx.fillStyle='rgba('+r+','+g+','+b+','+Math.min(alpha,1).toFixed(3)+')';
    ctx.fillText(t.label, pp.sx, pp.sy);
  }

  ctx.shadowBlur=0;
  requestAnimationFrame(draw);
}

function initCanvas(){
  rebuildSlots();
  requestAnimationFrame(draw);
}

// ESC fecha painel
window.addEventListener('keydown', e => {
  if(e.key === 'Escape') closePanel();
});

</script>
