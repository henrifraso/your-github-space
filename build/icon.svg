<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>

    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%"   stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>

    <!-- Branco com brilho: topo quase puro, esmaece levemente -->
    <linearGradient id="white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="40%"  stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>

    <!-- Brilho especular extra no topo -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.90"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="31%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Vinheta suave -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Sombra do número -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="3"  stdDeviation="5"  flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Glow branco sutil ao redor -->
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.12" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glowLayer"/>
      <feMerge>
        <feMergeNode in="glowLayer"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="numClip">
      <text x="512" y="596"
        text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="360" font-weight="900" letter-spacing="-6">001</text>
    </clipPath>

  </defs>

  <!-- Fundo mais claro -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Sombra do número -->
  <text x="512" y="600"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="360" font-weight="900" letter-spacing="-6"
    fill="#000" filter="url(#shadow)">001</text>

  <!-- Número branco com glow -->
  <text x="512" y="596"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="360" font-weight="900" letter-spacing="-6"
    fill="url(#white)"
    filter="url(#glow)">001</text>

  <!-- Reflexo especular no topo das letras -->
  <rect x="0" y="0" width="1024" height="1024"
    fill="url(#shine)"
    clip-path="url(#numClip)"/>

  <!-- Vinheta -->
  <rect width="1024" height="1024" fill="url(#vignette)"/>

</svg>
