<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>

    <!-- Fundo escuro com profundidade radial -->
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%"   stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Cromado com alto contraste: topo prata → escurece → base cinza -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e8e8e8"/>
      <stop offset="12%"  stop-color="#909090"/>
      <stop offset="30%"  stop-color="#2a2a2a"/>
      <stop offset="48%"  stop-color="#050505"/>
      <stop offset="49%"  stop-color="#000000"/>
      <stop offset="68%"  stop-color="#1e1e1e"/>
      <stop offset="85%"  stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#2e2e2e"/>
    </linearGradient>

    <!-- Reflexo especular forte no topo -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#fff" stop-opacity="0.60"/>
      <stop offset="18%" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="19%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Vinheta nas bordas -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="68%">
      <stop offset="45%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.90"/>
    </radialGradient>

    <!-- Sombra profunda abaixo do número -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="32" stdDeviation="36" flood-color="#000" flood-opacity="1"/>
      <feDropShadow dx="0" dy="8"  stdDeviation="10" flood-color="#000" flood-opacity="0.9"/>
    </filter>

    <!-- Rim light metálico fino -->
    <filter id="rim" x="-4%" y="-4%" width="108%" height="108%">
      <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="expanded"/>
      <feFlood flood-color="#888" result="c"/>
      <feComposite in="c" in2="expanded" operator="in" result="rimLayer"/>
      <feMerge>
        <feMergeNode in="rimLayer"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip do número para aplicar brilho somente sobre ele -->
    <clipPath id="numClip">
      <text x="512" y="596"
        text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="360" font-weight="900" letter-spacing="-6">001</text>
    </clipPath>

  </defs>

  <!-- Fundo — sem clipPath, macOS aplica o mask sozinho -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Sombra do número -->
  <text x="512" y="604"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="360" font-weight="900" letter-spacing="-6"
    fill="#000" filter="url(#shadow)">001</text>

  <!-- Número cromado -->
  <text x="512" y="596"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="360" font-weight="900" letter-spacing="-6"
    fill="url(#chrome)"
    filter="url(#rim)">001</text>

  <!-- Reflexo especular sobre o número -->
  <rect x="0" y="0" width="1024" height="1024"
    fill="url(#shine)"
    clip-path="url(#numClip)"/>

  <!-- Vinheta -->
  <rect width="1024" height="1024" fill="url(#vignette)"/>

</svg>
