name: Electron Release

# Builda o app desktop (.dmg pro macOS e .exe pro Windows) e publica como
# GitHub Release sempre que uma tag `v*` é criada.
#
# Uso:
#   git tag v1.0.0 && git push origin v1.0.0
#
# O draft do Release fica em https://github.com/henrifraso/your-github-space/releases
# Quando estiver pronto, marcar como "Latest" pra os assets ficarem em URLs
# previsíveis (.../releases/latest/download/<arquivo>).

on:
  push:
    tags:
      - 'v*'

# Permissões necessárias pra o GITHUB_TOKEN poder criar/editar Releases.
# Sem isso, softprops/action-gh-release falha com 403.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_glob: 'dist-installer/*.dmg'
          - os: windows-latest
            artifact_glob: 'dist-installer/*.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build Vite (dist/)
        env:
          ELECTRON: 'true'
        run: npm run build

      - name: Build Electron installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing + notarization (apenas macOS — secrets ausentes
          # em Windows fazem o afterSign hook pular notarização silencioso).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # --publish never: a gente sobe os assets manualmente no step abaixo
        # com softprops/action-gh-release. directories.output está no
        # package.json (cross-platform — flag inline quebra no PowerShell).
        run: npx electron-builder --publish never

      - name: Upload artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          # draft: false → release sai publicado como Latest automaticamente.
          # Se quiser revisar antes, troca pra true (vai pra Drafts).
          draft: false
          make_latest: 'true'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
